# =============================================================
# notifications.conf — Alert Notification Channel Configuration
# =============================================================
# Sensitive values (passwords, tokens) should be set in .env
# instead of here. This file can be committed to git safely.
# =============================================================

# --- Channels to enable (true/false) ---
SLACK_ENABLED=false
EMAIL_ENABLED=false
PAGERDUTY_ENABLED=false
WEBHOOK_ENABLED=false

# --- Slack ---
# SLACK_WEBHOOK_URL set in .env
SLACK_CHANNEL=#alerts
SLACK_CRITICAL_CHANNEL=#critical-alerts

# --- Email ---
# SMTP credentials set in .env
ALERT_EMAIL_TO=oncall@yourdomain.com
EMAIL_DAILY_REPORT=true
EMAIL_WEEKLY_REPORT=true

# --- PagerDuty ---
# PAGERDUTY_INTEGRATION_KEY set in .env
# Only CRITICAL alerts go to PagerDuty

# --- Custom Webhook ---
# CUSTOM_WEBHOOK_URL set in .env

# --- Alert Cooldowns (minutes) ---
CRITICAL_RESEND_MINUTES=60
WARNING_RESEND_MINUTES=120

# --- Ping Targets ---
PING_TARGETS="8.8.8.8 1.1.1.1"
PING_COUNT=4
PING_TIMEOUT=5

# --- TCP Port Checks ---
CHECK_PORTS="localhost:22"
