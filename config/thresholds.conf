# =============================================================
# thresholds.conf — Alert Threshold Configuration
# =============================================================
# All percentage values unless noted otherwise.
# Changes take effect on next cron run (no restart needed).
# =============================================================

# --- CPU ---
CPU_WARNING=80
CPU_CRITICAL=95
LOAD_WARNING=4
LOAD_CRITICAL=8

# --- Memory ---
RAM_WARNING=80
RAM_CRITICAL=95
SWAP_WARNING=50
SWAP_CRITICAL=80

# --- Disk ---
DISK_WARNING=80
DISK_CRITICAL=95
INODE_WARNING=80
INODE_CRITICAL=95

# --- Network ---
PING_LOSS_WARNING=10
PING_LATENCY_WARNING=200
PACKET_DROP_THRESHOLD=100

# --- Processes ---
PROCESS_CPU_WARNING=80
PROCESS_COUNT_WARNING=500
TOP_PROCESS_COUNT=10

# --- Docker ---
DOCKER_RESTART_THRESHOLD=5

# --- Trend Detection ---
TREND_SAMPLES=3
TREND_SLOPE_THRESHOLD=5
TREND_MIN_VALUE_PCT=50
DISK_TREND_MIN=60

# --- Uptime ---
RECENT_REBOOT_THRESHOLD_SECONDS=600

# --- Self Test ---
COLLECTOR_STALE_MINUTES=15
MIN_FREE_DISK_MB=500
